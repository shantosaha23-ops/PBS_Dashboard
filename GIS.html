
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>GIS Feeder Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <!-- Leaflet LocateControl CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css" />
    <style>
        body { margin: 0; }
        #map { height: 100vh; width: 100%; }
        @keyframes blink { 
            0% { opacity: 1; } 
            50% { opacity: 0.2; } 
            100% { opacity: 1; } 
        }
        .blink-line { animation: blink 1s linear infinite; }
        .measure-btn {
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 4px;
            padding: 6px 10px;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 1px 5px rgba(0,0,0,0.65);
        }
        .measure-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet LocateControl JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js" charset="utf-8"></script>
    <script>
        // Define base map layers
        const standardLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, swisstopo, and the GIS User Community'
        });

        // Initialize map with standard layer active by default
        const map = L.map('map', {
            center: [24.7936, 88.9318],
            zoom: 14,
            layers: [standardLayer]
        });

        // Add Layer Control toggle box (Top Right)
        const baseMaps = {
            "Standard Map": standardLayer,
            "Satellite View": satelliteLayer
        };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        // Add "My Location" control
        const lc = L.control.locate({
            position: 'topleft',
            strings: { title: "Show my location" },
            locateOptions: { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 },
            showPopup: false
        }).addTo(map);

        // Native Distance Measurement Control State
        let measureActive = false;
        let measurePoints = [];
        let measureMarkers = [];
        let measureLine = null;
        let measurePopup = L.popup();

        const MeasureControl = L.Control.extend({
            options: { position: 'topleft' },
            onAdd: function (map) {
                const container = L.DomUtil.create('div', 'leaflet-bar');
                const btn = L.DomUtil.create('button', 'measure-btn', container);
                btn.innerHTML = '📏 Measure';
                
                L.DomEvent.disableClickPropagation(btn);
                L.DomEvent.on(btn, 'click', function() {
                    measureActive = !measureActive;
                    if (measureActive) {
                        btn.classList.add('active');
                        btn.innerHTML = '📏 Measuring...';
                        clearMeasurement();
                    } else {
                        btn.classList.remove('active');
                        btn.innerHTML = '📏 Measure';
                        clearMeasurement();
                    }
                });
                return container;
            }
        });
        map.addControl(new MeasureControl());

        // Handle map clicks for measurement
        map.on('click', function(e) {
            if (!measureActive) return;

            measurePoints.push(e.latlng);
            const marker = L.circleMarker(e.latlng, { radius: 5, color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 1 }).addTo(map);
            measureMarkers.push(marker);

            if (measurePoints.length > 1) {
                if (measureLine) map.removeLayer(measureLine);
                measureLine = L.polyline(measurePoints, { color: '#2563eb', weight: 4, dashArray: '5, 5' }).addTo(map);

                let totalDistance = 0;
                for (let i = 0; i < measurePoints.length - 1; i++) {
                    totalDistance += measurePoints[i].distanceTo(measurePoints[i+1]);
                }

                let distText = totalDistance > 1000 ? 
                    (totalDistance / 1000).toFixed(2) + ' km' : 
                    Math.round(totalDistance) + ' meters';

                measurePopup.setLatLng(e.latlng)
                    .setContent(`<b>Distance:</b> ${distText}<br><small style="color:gray;">Tap map to add points or toggle button to clear</small>`)
                    .openOn(map);
            } else {
                measurePopup.setLatLng(e.latlng)
                    .setContent(`<b>Start Point Set</b><br><small style="color:gray;">Tap next point</small>`)
                    .openOn(map);
            }
        });

        function clearMeasurement() {
            measurePoints = [];
            measureMarkers.forEach(m => map.removeLayer(m));
            measureMarkers = [];
            if (measureLine) { map.removeLayer(measureLine); measureLine = null; }
            map.closePopup(measurePopup);
        }

        const KML_URL = "https://raw.githubusercontent.com/shantosaha23-ops/gisdashboard/refs/heads/main/Naogaon_1_SS_Atribute.kml";
        const FIREBASE_URL = "https://allpbs-f3b0c-default-rtdb.asia-southeast1.firebasedatabase.app/.json";
                
        let firebaseData = {};
        let geoJsonLayer = null;
        let kmlData = null;

        async function loadFirebase() {
            try {
                const res = await fetch(FIREBASE_URL);
                firebaseData = await res.json() || {};
            } catch(e) { console.log("Firebase load error:", e); }
        }

        // Returns an array of clean base feeder IDs if split by '/'
        // e.g., "NG1-2B-6 / NG1-8H-6" -> ["NG1_2B", "NG1_8H"]
        function getFeederIDs(name) {
            if (!name) return [];
            return name.split('/').map(part => {
                const clean = part.toUpperCase().replace(/[^A-Z0-9-]/g, "_");
                const segments = clean.split(/[-_]/).filter(Boolean);
                // Keep up to the first 2 segments (e.g., NG1 and 2B)
                return segments.slice(0, 2).join("_");
            }).filter(Boolean);
        }

        function findDevice(targetID) {
            if (!targetID || !firebaseData) return null;
            for (const pbs in firebaseData) {
                if (typeof firebaseData[pbs] !== 'object') continue;
                for (const sub in firebaseData[pbs]) {
                    const devs = firebaseData[pbs][sub];
                    if (!devs) continue;
                    for (const dev in devs) {
                        const d = devs[dev];
                        if (d) {
                            for (const k in d) {
                                const cleanKey = k.toUpperCase().replace(/[^A-Z0-9-]/g, "_").split(/[-_]/).filter(Boolean).slice(0, 2).join("_");
                                if (cleanKey === targetID) return { parent: d, node: d[k] };
                            }
                        }
                    }
                }
            }
            return null;
        }

        // Evaluate all sub-feeders found within a slash-separated string
        function getFeederBundle(name) {
            const ids = getFeederIDs(name);
            let devices = [];
            ids.forEach(id => {
                const dev = findDevice(id);
                devices.push({ id: id, device: dev });
            });
            return devices;
        }

        function isBundleOnline(bundle) {
            if (!bundle.length) return false;
            // Consider online if at least one circuit responds recently
            return bundle.some(b => {
                if (!b.device || !b.device.parent) return false;
                let hb = b.device.parent.lastHeartbeat || b.device.parent.heartbeat || b.device.parent.status?.lastHeartbeat;
                hb = Number(hb);
                if (isNaN(hb)) return false;
                if (hb < 1e12) hb *= 1000;
                return (Date.now() - hb) <= 120000;
            });
        }

        function getTags(bundle) {
            let tags = [];
            bundle.forEach(b => {
                if (b.device && b.device.node) {
                    tags.push({ name: b.id, status: b.device.node.status });
                }
            });
            return tags;
        }

        function getColor(tags, online) {
            if (!online) return "blue";
            let on = 0, off = 0;
            tags.forEach(t => { 
                if (t.status === "ON") on++; 
                if (t.status === "OFF") off++; 
            });
            if (on && off) return "orange";
            return off ? "red" : "Magenta";
        }

        function buildPopup(props, nameStr, online, tags) {
            let html = `<div style="font-family:sans-serif;font-size:13px;min-width:220px;">
                <div style="background:#1f2937;color:white;padding:8px;text-align:center;">${nameStr}</div>
                <div style="text-align:center;margin:10px;"><span style="padding:4px 12px;border-radius:15px;color:white;background:${online ? '#22c55e' : '#ef4444'}">${online ? "ONLINE" : "OFFLINE"}</span></div>`;
            if (online && tags.length) {
                html += `<div><b>Status</b><br>${tags.map(t => `${t.name}: <b>${t.status}</b>`).join("<br>")}</div>`;
            }
            html += `<hr><b>Details</b><table style="font-size:12px;">`;
            for (const k in props) {
                if (k !== "name" && props[k]) {
                    html += `<tr><td>${k}</td><td>: ${props[k]}</td></tr>`;
                }
            }
            return html + `</table></div>`;
        }

        function updateMap() {
            if (!kmlData) return; 
            if (!geoJsonLayer) {
                geoJsonLayer = L.geoJSON(kmlData, {
                    style: f => getStyle(f),
                    pointToLayer: (f, latlng) => L.circleMarker(latlng, getMarkerOptions(f)),
                    onEachFeature: (f, l) => {
                        if (f.geometry.type === "Point") {
                            const nameStr = f.properties.name || "";
                            l.bindPopup(buildPopup(f.properties, nameStr, false, []));
                        }
                    }
                }).addTo(map);
            } else {
                geoJsonLayer.eachLayer(l => {
                    const f = l.feature;
                    if (!f) return;
                    const nameStr = f.properties.name || "";
                    const bundle = getFeederBundle(nameStr);
                    const online = isBundleOnline(bundle);
                    const tags = getTags(bundle);
                                    
                    if (l.setStyle) {
                        l.setStyle(l.options.radius ? getMarkerOptions(f) : getStyle(f));
                    }
                    if (f.geometry.type === "Point") {
                        l.setPopupContent(buildPopup(f.properties, nameStr, online, tags));
                    }
                });
            }
        }

        function getStyle(f) {
            const nameStr = f.properties.name || "";
            const bundle = getFeederBundle(nameStr);
            const online = isBundleOnline(bundle);
            const tags = getTags(bundle);
            return { 
                color: getColor(tags, online), 
                weight: 4,
                className: (online && tags.some(t => t.status === "OFF")) ? "blink-line" : ""
            };
        }

        function getMarkerOptions(f) {
            const nameStr = f.properties.name || "";
            const bundle = getFeederBundle(nameStr);
            const online = isBundleOnline(bundle);
            const tags = getTags(bundle);
            return { 
                radius: 6, 
                color: getColor(tags, online), 
                fillOpacity: 0.9,
                className: (online && tags.some(t => t.status === "OFF")) ? "blink-line" : ""
            };
        }

        async function init() {
            const xmlResponse = await fetch(KML_URL);
            const xmlText = await xmlResponse.text();
            const xml = new DOMParser().parseFromString(xmlText, "text/xml");
            
            kmlData = Array.from(xml.getElementsByTagName("Placemark")).map(pm => {
                const coord = pm.getElementsByTagName("coordinates")[0]?.textContent;
                if (!coord) return null;
                
                const props = { 
                    name: pm.getElementsByTagName("name")[0]?.textContent || "" 
                };
                
                Array.from(pm.querySelectorAll("Data, SimpleData")).forEach(d => {
                    const name = d.getAttribute("name");
                    const val = d.querySelector("value") ? d.querySelector("value").textContent : d.textContent;
                    if (name) props[name] = val;
                });
                
                const coords = coord.trim().split(/\s+/).map(p => p.split(",").map(Number));
                return { 
                    type: "Feature", 
                    properties: props, 
                    geometry: coords.length === 1 ? { type: "Point", coordinates: coords[0] } : { type: "LineString", coordinates: coords } 
                };
            }).filter(Boolean);
            
            await loadFirebase();
            updateMap();
            
            setInterval(async () => { 
                await loadFirebase(); 
                updateMap(); 
            }, 30000);
        }

        init();
    </script>
</body>
</html>
