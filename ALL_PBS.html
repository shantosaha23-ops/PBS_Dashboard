<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PBS Multi Substation Monitor</title>
    <style>
        :root{ --bg:#f5f7fb; --card:#ffffff; --primary:#2d9cff; --danger:#c62828; }
        body{ margin:0; padding:12px; font-family:system-ui,Roboto; background:var(--bg); color:#111; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        h1{ text-align:center; font-size:22px; margin:0 0 14px 0; }
        #header-area { flex-shrink: 0; background: var(--bg); padding-bottom: 10px; border-bottom: 1px solid #ddd; }
        #controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 5px;}
        #controls select, #controls input { flex: 1 1 120px; box-sizing: border-box;}
        #subSearch { flex: 2 1 200px; }
        .row-bottom { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 5px; }
        select{ padding:10px; border-radius:8px; border:1px solid #ccc; }
        #onlineStatus{ padding:6px 12px; border-radius:6px; color:#fff; background:#888; font-weight:700; }
        #container{ flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .substationTitle{ margin-top:24px; margin-bottom:10px; font-size:20px; font-weight:700; color:#0d47a1; }
        .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
        .card{ background:var(--card); padding:12px; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.08); cursor:pointer; user-select:none; }
        .row{ display:flex; align-items:center; }
        .led{ width:14px; height:14px; border-radius:50%; margin-right:8px; background:#bbb; }
        .on{ background:#2ecc71; }
        .off{ background:#e74c3c; }
        .blink{ animation:blink 1s infinite; }
        @keyframes blink{ 0%,50%,100%{opacity:1;} 25%,75%{opacity:0;} }
        .label{ font-weight:700; font-size:15px; }
        .statusText{ margin-top:6px; font-weight:700; }
        .details-section{ display:none; margin-top:10px; padding-top:10px; border-top:1px solid #eee; }
        .trip{ font-size:12px; color:var(--danger); margin-top:4px; font-weight:700; }
        .last{ font-size:12px; margin-top:3px; word-break:break-word; }
        .faultBox{ margin-top:8px; padding:8px; border-radius:8px; background:#f0f8ff; border:1px solid #2d9cff; display:none; }
        input{ width:100%; padding:6px; border:1px solid #ccc; border-radius:6px; margin-bottom:6px; box-sizing:border-box; }
        .smallBtn { padding: 6px 10px; font-size: 12px; background-color: #2d9cff; color: #ffffff; border: none; border-radius: 4px; cursor: pointer; }
        .footer{ text-align:center; margin-top:30px; font-size:13px; padding-bottom: 20px; }
    </style>
</head>
<body>
<div id="header-area">      
    <h1>PBS Multi Substation Feeder Monitoring</h1>        
    <div id="controls">            
        <select id="pbsFilter" onchange="onFilterChange()">             
            <option value="SELECT">-- Select PBS --</option>         
        </select>        
        <select id="subFilter" onchange="renderCards()">             
            <option value="ALL">All Substation</option>         
        </select>        
        <input type="text" id="subSearch" placeholder="Search Substation..." oninput="renderCards()">    
    </div>
    <div class="row-bottom">        
        <button onclick="refreshDashboard()" style="background-color: var(--primary); color: #fff; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 700; cursor: pointer;">🔄 Refresh</button>        
        <div id="onlineStatus">Connecting...</div>    
    </div>
</div>

<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
const FIREBASE_URL = "https://allpbs-f3b0c-default-rtdb.asia-southeast1.firebasedatabase.app";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbww1DL8cnIrcxyZ4gzOtDd1n94sHyIlM3d5XDmt3QHrvEb8zVtHkoqzaVKzJCyFYjf4iw/exec";    

let firebaseData = {}; let sheetTripData = []; let faultData = []; let cardMap = {};

function formatDisplayTime(t) {
  if (!t || t === "--") return "--";
  const date = new Date(t);
  if (isNaN(date.getTime())) return String(t);
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ` +         
         `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

function toggleDetails(id) {
  const el = document.getElementById("details_" + id);
  el.style.display = (el.style.display === "block") ? "none" : "block";
}

// Keep track of loading state
let isInitialLoad = true;

async function loadAll() {
    document.getElementById("onlineStatus").innerText = "Updating...";
    
    try {
        // 1. Fetch everything in parallel again, but with better error handling
        // Increase timeout for the Sheet requests as they are slower
        const [fb, trip, fault] = await Promise.all([
            axios.get(FIREBASE_URL + "/.json", { timeout: 15000 }),
            axios.get(SCRIPT_URL + "?mode=trip", { timeout: 20000 }),
            axios.get(SCRIPT_URL + "?mode=fault", { timeout: 20000 })
        ]);

        firebaseData = fb.data || {};
        sheetTripData = Array.isArray(trip.data) ? trip.data : (trip.data?.data || []);
        window.allFaults = Array.isArray(fault.data) ? fault.data : (fault.data?.data || []);

        // 2. Build filters ONLY on initial load to avoid UI jumping
        if (isInitialLoad) {
            buildFilters();
            isInitialLoad = false;
        }

        // 3. Render once everything is confirmed
        renderCards();
        
        document.getElementById("onlineStatus").innerText = "ONLINE";
        document.getElementById("onlineStatus").style.background = "#2ecc71";
    } catch (err) {
        console.error("Dashboard error:", err);
        document.getElementById("onlineStatus").innerText = "OFFLINE (Retrying...)";
        document.getElementById("onlineStatus").style.background = "#c62828";
    }
}
function buildFilters() {
    const pbsFilter = document.getElementById("pbsFilter");
    const subFilter = document.getElementById("subFilter");
    const currentPbs = pbsFilter.value;
    const currentSub = subFilter.value;
    const pbsList = Object.keys(firebaseData);

    pbsFilter.innerHTML = '<option value="SELECT">-- Select PBS --</option>' + 
         pbsList.map(v => `<option value="${v}" ${v === currentPbs ? 'selected' : ''}>${v}</option>`).join('');
        
    let subList = [];
    if (currentPbs !== "SELECT" && currentPbs !== "ALL") {
        subList = Object.keys(firebaseData[currentPbs] || {});
    }
        
    subList = [...new Set(subList)];
    subFilter.innerHTML = '<option value="ALL">All Substation</option>' + 
         subList.map(v => `<option value="${v}" ${v === currentSub ? 'selected' : ''}>${v}</option>`).join('');
}

function getSheetRow(pbs, sub, dev, relay) { 
  return sheetTripData.find(r => r.pbs === pbs && r.sub === sub && r.dev === dev && r.relay === relay) || null; 
}

function renderCards() {
  const container = document.getElementById("container");
  container.innerHTML = "";
  const pbsFilter = document.getElementById("pbsFilter").value;

  if (pbsFilter === "SELECT") {
      container.innerHTML = '<div style="text-align:center; margin-top:50px; color:#666;">Please select a PBS from the dropdown to view monitor data.</div>';
      return;
  }
    
  const subFilter = document.getElementById("subFilter").value;
  const searchVal = document.getElementById("subSearch").value.toLowerCase();
    
  const now = Date.now();
  const TIMEOUT_MS = 100000;
  const faults = window.allFaults || [];

  for (let pbs in firebaseData) {
    if (pbsFilter !== "ALL" && pbs !== pbsFilter) continue;
        
    let pbsOnCount = 0; let pbsTotalCount = 0;
    let pbsOnlineSubs = 0;
    let pbsTotalSubs = Object.keys(firebaseData[pbs]).length;

    for (let sub in firebaseData[pbs]) {
      let isSubOnline = false;
      for (let dev in firebaseData[pbs][sub]) {
        const hb = (firebaseData[pbs][sub][dev].lastHeartbeat || 0) * 1000;
        if ((now - hb) < TIMEOUT_MS) isSubOnline = true;
      }            
      if (isSubOnline) {
        pbsOnlineSubs++;
        for (let dev in firebaseData[pbs][sub]) {
          for (let relay in firebaseData[pbs][sub][dev]) {
            if (["power", "deviceStatus", "lastHeartbeat"].includes(relay)) continue;
            pbsTotalCount++;
            if (firebaseData[pbs][sub][dev][relay].status === "ON") pbsOnCount++;
          }
        }
      }
    }        
        
    const pbsHeader = document.createElement("div");
    pbsHeader.innerHTML = `<div style="background:#e3f2fd; padding:12px; margin-top:20px; border-radius:12px; border-left:5px solid #2d9cff;">
        <h2 style="margin:0; font-size:18px;">${pbs} Summary</h2>
        <div style="margin-top:5px; font-size:14px;">
            Substations Online: <b>${pbsOnlineSubs} / ${pbsTotalSubs}</b><br>
            Feeders ON: <b>${pbsOnCount} / ${pbsTotalCount}</b>
        </div></div>`;
    container.appendChild(pbsHeader);

    for (let sub in firebaseData[pbs]) {          
      if (subFilter !== "ALL" && sub !== subFilter) continue;
      if (searchVal && !sub.toLowerCase().includes(searchVal)) continue;
            
      let subV = 0, subI = 0, subP = 0, subPF = 0, subF = 0, count = 0, isSubOnline = false, subOnCount = 0, subTotalCount = 0;
      let lastUpdateTime = 0; 
      
      for (let dev in firebaseData[pbs][sub]) {
        const device = firebaseData[pbs][sub][dev];
        const lastHeartbeat = (device.lastHeartbeat || 0) * 1000;
        if ((now - lastHeartbeat) < TIMEOUT_MS) isSubOnline = true;
        if (lastHeartbeat > lastUpdateTime) lastUpdateTime = lastHeartbeat;
      }

      if (isSubOnline) {
          for (let dev in firebaseData[pbs][sub]) {
            const device = firebaseData[pbs][sub][dev];
            for (let relay in device) { 
               if (["power", "deviceStatus", "lastHeartbeat"].includes(relay)) continue;
               subTotalCount++;
               if (device[relay].status === "ON") subOnCount++;
            }
            const pwr = device.power || {};
            if (pwr && Object.keys(pwr).length > 0) {
              subV += Number(pwr.V || pwr.v || 0); subI += Number(pwr.I || pwr.c || 0);
              subP += Number(pwr.P || pwr.p || 0); subPF += Number(pwr.PF || pwr.pf || 0);
              subF += Number(pwr.F || pwr.f || 0); count++;
            }
          }
      }

      const title = document.createElement("div");
      title.className = "substationTitle";
      title.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${sub}</span>
          <span style="font-size:12px; font-weight:bold; color:#2d9cff;">${isSubOnline ? subOnCount + '/' + subTotalCount : '--'} Feeders ON</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
           <span style="font-size:11px; color:#555;">Updated: ${lastUpdateTime > 0 ? formatDisplayTime(lastUpdateTime) : '--'}</span>
           <span style="font-size:13px; color:${isSubOnline ? '#2ecc71' : '#c62828'}">● ${isSubOnline ? "ONLINE" : "OFFLINE"}</span>
        </div>
        <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:5px; margin-top:8px; background:#fff; padding:8px; border-radius:8px; border:1px solid #e0e0e0; font-size:11px; text-align:center;">
          <div><b style="color:#555;">V:</b> ${isSubOnline ? (count ? (subV/count).toFixed(2) : 0) + 'KV' : '--'}</div>
          <div><b style="color:#555;">I:</b> ${isSubOnline ? subI.toFixed(2) + 'A' : '--'}</div>
          <div><b style="color:#555;">P:</b> ${isSubOnline ? subP.toFixed(2) + 'MW' : '--'}</div>
          <div><b style="color:#555;">PF:</b> ${isSubOnline ? (count ? (subPF/count).toFixed(2) : 0) : '--'}</div>
          <div><b style="color:#555;">F:</b> ${isSubOnline ? (count ? (subF/count).toFixed(2) : 0) + 'Hz' : '--'}</div>
        </div>`;
      container.appendChild(title);
      
      const grid = document.createElement("div");
      grid.className = "grid";
      container.appendChild(grid);

      for (let dev in firebaseData[pbs][sub]) {
        for (let relay in firebaseData[pbs][sub][dev]) {
          if (["power", "deviceStatus", "lastHeartbeat"].includes(relay)) continue;
                    
          const fb = firebaseData[pbs][sub][dev][relay];
          const row = getSheetRow(pbs, sub, dev, relay); 
          const id = `${pbs}_${sub}_${dev}_${relay}`;
          cardMap[id] = { pbs, sub, dev, relay };

          const displayStatus = isSubOnline ? (fb.status || "--") : "--";
          const ledClass = isSubOnline ? (fb.status==="ON" ? "on" : "off blink") : "";

          const fault = faults.find(f =>
            String(f.pbs || f.PBS || "").trim().toUpperCase() === String(pbs).trim().toUpperCase() &&
            String(f.sub || f.SUB || "").trim().toUpperCase() === String(sub).trim().toUpperCase() &&
            String(f.dev || f.DEV || "").trim().toUpperCase() === String(dev).trim().toUpperCase() &&
            String(f.relay || f.RELAY || "").trim().toUpperCase() === String(relay).trim().toUpperCase()
          );

          const faultReason = fault?.message || fault?.fault || fault?.faultReason || "";
          const isStatusOn = (fb.status === "ON");

          let faultBoxHtml = "";
          if (!isStatusOn) {
            if (faultReason) {
              faultBoxHtml = `
                <div class="faultBox" style="display:block" onclick="event.stopPropagation()">
                   <div style="font-weight:700; color:#0d47a1;">Fault Reason:</div>
                   <div style="margin-top:4px; font-size:13px;">${faultReason}</div>
                </div>`;
            } else if (isSubOnline && fb.status === "OFF") {
              faultBoxHtml = `
                <div class="faultBox" id="fault_${id}" style="display:block" onclick="event.stopPropagation()">
                   <input type="text" id="input_${id}" placeholder="Enter Fault Reason">
                   <button class="smallBtn" onclick="saveFault('${id}')">Save</button>
                </div>`;
            }
          }

          grid.innerHTML += `
          <div class="card" onclick="toggleDetails('${id}')">
            <div class="row">
              <div class="led ${ledClass}"></div>
              <div class="label">${relay.toUpperCase()}</div>
            </div>
            <div class="statusText">Status: ${displayStatus}</div>
            <div id="details_${id}" class="details-section">
              <div class="trip">This Month: ${row?.thisMonthTrips || 0}</div>
              <div class="trip">Last Month: ${row?.lastMonthTrips || 0}</div>
              <div class="last">Last OFF: ${formatDisplayTime(row?.lastTripTime)}</div>
              <div class="last">Last ON: ${formatDisplayTime(row?.lastOnTime)}</div>
              <div class="last"><b>Area:</b> ${row?.area || "N/A"}</div>
            </div>
            ${faultBoxHtml}
          </div>`;
        }
      }
    }
  }
  container.innerHTML += '<div class="footer"><b>Developed by: Shanta Saha</b><br>AGM (O&amp;M)<br>Naogaon PBS-1</div>';
}

function onFilterChange() {
    document.getElementById("subFilter").value = "ALL";
    buildFilters();
    renderCards();
}

async function saveFault(id) {
  const reason = document.getElementById("input_" + id).value.trim();
  if(!reason) return alert("Enter fault reason");
  const obj = cardMap[id];
  await fetch(`${SCRIPT_URL}?mode=saveFault&pbs=${encodeURIComponent(obj.pbs)}&sub=${encodeURIComponent(obj.sub)}&dev=${encodeURIComponent(obj.dev)}&relay=${encodeURIComponent(obj.relay)}&message=${encodeURIComponent(reason)}`, {method:"POST", mode:"no-cors"});
  setTimeout(loadAll, 1000);
}

async function refreshDashboard() { await loadAll(); }

// Safely boot dashboard and refresh every 30 seconds
refreshDashboard();
setInterval(refreshDashboard, 30000);
</script>
</body>
</html>
