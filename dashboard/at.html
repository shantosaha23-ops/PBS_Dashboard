<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reliability Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .filter-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .table-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .val-saifi { color: #0d6efd; font-weight: bold; }
        .val-saidi { color: #dc3545; font-weight: bold; }
        th { background-color: #212529 !important; color: white !important; white-space: nowrap; }
    </style>
</head>

<body>

<div class="container-fluid">
    <h2 class="text-center my-4 fw-bold">SAIDI/SAIFI Reliability Report</h2>

    <div class="filter-section">
        <div class="row g-3 align-items-end">

            <div class="col-md-3">
                <label class="form-label fw-bold">PBS ID</label>
                <select id="pbsFilter" class="form-select" onchange="updateSubFilter()">
                    <option value="all">All PBS</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">SUB ID</label>
                <select id="subFilter" class="form-select" onchange="applyFilters()">
                    <option value="all">All SUBs</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">Month</label>
                <select id="monthFilter" class="form-select" onchange="applyFilters()">
                    <option value="all">All Months</option>
                </select>
            </div>

            <div class="col-md-3 text-md-end">
                <button class="btn btn-success btn-sm" onclick="exportToExcel()">Excel</button>
                <button class="btn btn-danger btn-sm" onclick="exportToPDF()">PDF</button>
            </div>

        </div>
    </div>

    <div id="dashboard-content" class="table-container">
        <div class="text-center p-5">Loading data...</div>
    </div>
</div>

<script>
const MASTER_URL = "https://script.google.com/macros/s/AKfycbwjFowLcbxm_hvvqCS2opKpnN9_S3-rTPg6rxu42U8QR6cmfL3Rd-k-qgS3fXkFj8lXcg/exec?mode=history";

let MASTER_DATA = [];

function formatMonth(value) {
    if (!value) return "";

    // If already YYYY-MM format
    if (typeof value === "string" && /^\d{4}-\d{2}$/.test(value)) {
        return value;
    }

    // If ISO date like 2026-04-30T18:00:00.000Z
    if (typeof value === "string" && value.includes("T")) {
        const d = new Date(value);

        // IMPORTANT: use LOCAL time, not UTC
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, "0");

        return `${year}-${month}`;
    }

    return value;
}

/* =========================
   LOAD DATA
========================= */
async function loadData() {
    try {
        const response = await fetch(MASTER_URL);
        const data = await response.json();

        MASTER_DATA = (data.reliability || []).map(r => ({
            ...r,
            Month: formatMonth(r.Month)
        }));

        const pbsSet = new Set();
        const monthSet = new Set();

        MASTER_DATA.forEach(r => {
            pbsSet.add(r.PBS_ID);
            monthSet.add(r.Month);
        });

        const pbsSelect = document.getElementById('pbsFilter');
        const monthSelect = document.getElementById('monthFilter');

        pbsSet.forEach(p => {
            pbsSelect.innerHTML += `<option value="${p}">${p}</option>`;
        });

        monthSet.forEach(m => {
            monthSelect.innerHTML += `<option value="${m}">${m}</option>`;
        });

        applyFilters();

    } catch (e) {
        console.error(e);
        document.getElementById('dashboard-content').innerHTML = "Error loading data.";
    }
}

/* =========================
   SUB FILTER UPDATE
========================= */
function updateSubFilter() {
    const pbsVal = document.getElementById('pbsFilter').value;
    const subSelect = document.getElementById('subFilter');

    subSelect.innerHTML = '<option value="all">All SUBs</option>';

    const subs = new Set();

    MASTER_DATA.forEach(item => {
        if (pbsVal === 'all' || String(item.PBS_ID) === pbsVal) {
            subs.add(item.SUB_ID);
        }
    });

    subs.forEach(s => {
        subSelect.innerHTML += `<option value="${s}">${s}</option>`;
    });

    applyFilters();
}

/* =========================
   APPLY FILTERS
========================= */
function applyFilters() {
    const pbsVal = document.getElementById('pbsFilter').value;
    const subVal = document.getElementById('subFilter').value;
    const monthVal = document.getElementById('monthFilter').value;

    const filtered = MASTER_DATA.filter(item =>
        (pbsVal === 'all' || String(item.PBS_ID) === pbsVal) &&
        (subVal === 'all' || String(item.SUB_ID) === subVal) &&
        (monthVal === 'all' || String(item.Month) === monthVal)
    );

    renderTable(filtered);
}

/* =========================
   RENDER TABLE
========================= */
function renderTable(data) {
    const dashboard = document.getElementById('dashboard-content');

    let rows = data.map(i => `
        <tr>
            <td>${i.Month}</td>
            <td>${i.PBS_ID}</td>
            <td>${i.SUB_ID}</td>
            <td>${i.FeederID}</td>
            <td>${i.Customers}</td>
            <td>${i.Interruptions}</td>
            <td>${Number(i.OutageMin).toFixed(1)}</td>
            <td class="val-saifi">${Number(i.SAIFI).toFixed(4)}</td>
            <td class="val-saidi">${Number(i.SAIDI).toFixed(4)}</td>
        </tr>
    `).join('');

    dashboard.innerHTML = `
        <div class="table-responsive">
            <table class="table table-sm table-hover" id="reportTable">
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>PBS</th>
                        <th>SUB</th>
                        <th>Feeder</th>
                        <th>Cust</th>
                        <th>Int</th>
                        <th>Mins</th>
                        <th>SAIFI</th>
                        <th>SAIDI</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
    `;
}

/* =========================
   EXPORT
========================= */
function exportToExcel() {
    const table = document.getElementById('reportTable');
    const wb = XLSX.utils.table_to_book(table);
    XLSX.writeFile(wb, "Reliability_Report.xlsx");
}

function exportToPDF() {
    html2pdf().from(document.getElementById('reportTable')).save('Reliability_Report.pdf');
}

/* =========================
   INIT
========================= */
loadData();
</script>

</body>
</html>
