

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PBS Multi Substation Monitor</title>
<style>
:root{ --bg:#f5f7fb; --card:#ffffff; --primary:#2d9cff; --danger:#c62828; }
body{ margin:12px; font-family:system-ui,Roboto; background:var(--bg); color:#111; }
h1{ text-align:center; font-size:22px; margin-bottom:14px; }
#controls{ display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
button{ padding:10px 14px; border:0; border-radius:8px; background:var(--primary); color:#fff; font-weight:700; cursor:pointer; }
select{ padding:10px; border-radius:8px; border:1px solid #ccc; }
#onlineStatus{ padding:6px 12px; border-radius:6px; color:#fff; background:#888; font-weight:700; }
.substationTitle{ margin-top:24px; margin-bottom:10px; font-size:20px; font-weight:700; color:#0d47a1; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
.card{ background:var(--card); padding:12px; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.08); cursor:pointer; user-select:none; }
.row{ display:flex; align-items:center; }
.led{ width:14px; height:14px; border-radius:50%; margin-right:8px; background:#bbb; }
.on{ background:#2ecc71; }
.off{ background:#e74c3c; }
.blink{ animation:blink 1s infinite; }
@keyframes blink{ 0%,50%,100%{opacity:1;} 25%,75%{opacity:0;} }
.label{ font-weight:700; font-size:15px; }
.statusText{ margin-top:6px; font-weight:700; }
.details-section{ display:none; margin-top:10px; padding-top:10px; border-top:1px solid #eee; }
.trip{ font-size:12px; color:var(--danger); margin-top:4px; font-weight:700; }
.last{ font-size:12px; margin-top:3px; word-break:break-word; }
.faultBox{ margin-top:8px; padding:8px; border-radius:8px; background:#f0f8ff; border:1px solid #2d9cff; display:none; }
input{ width:100%; padding:6px; border:1px solid #ccc; border-radius:6px; margin-bottom:6px; box-sizing:border-box; }
.smallBtn{ padding:6px 10px; font-size:12px; }
.footer{ text-align:center; margin-top:30px; font-size:13px; }
</style>
</head>
<body>
<h1>PBS Multi Substation Feeder Monitoring</h1>
<div id="controls">
  <button onclick="refreshDashboard()">🔄 Refresh</button>
  <select id="pbsFilter" onchange="onFilterChange()"> <option value="ALL">All PBS</option> </select>
  <select id="subFilter" onchange="renderCards()"> <option value="ALL">All Substation</option> </select>
  <div id="onlineStatus">Connecting...</div>
</div>
<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
const FIREBASE_URL = "https://allpbs-default-rtdb.asia-southeast1.firebasedatabase.app";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIy0Ckk_uEUEkoGCbeORDDk2V1Hhavb073sLieBAnbjWAdOGqL_L1rnTUqK4nGIkzBHg/exec";    

let firebaseData = {}; let sheetTripData = []; let faultData = []; let cardMap = {};

function toggleDetails(id) {
  const el = document.getElementById("details_" + id);
  el.style.display = (el.style.display === "block") ? "none" : "block";
}

async function loadAll() {
  try {
    const [fb, trip, fault] = await Promise.all([
      axios.get(FIREBASE_URL + "/.json"),
      axios.get(SCRIPT_URL + "?mode=trip"),
      axios.get(SCRIPT_URL + "?mode=fault")
    ]);
    firebaseData = fb.data || {};
    sheetTripData = Array.isArray(trip.data) ? trip.data : (trip.data?.data || []);
    
    // UPDATED: Store fault data in window.allFaults so renderCards can find it
    window.allFaults = Array.isArray(fault.data) ? fault.data : (fault.data?.data || []);
    
    buildFilters();
    renderCards();
    document.getElementById("onlineStatus").innerText = "ONLINE";
    document.getElementById("onlineStatus").style.background = "#2ecc71";
  } catch (err) {
    document.getElementById("onlineStatus").innerText = "OFFLINE";
    document.getElementById("onlineStatus").style.background = "#c62828";
  }
}

function buildFilters() {
    const pbsFilter = document.getElementById("pbsFilter");
    const subFilter = document.getElementById("subFilter");
    
    // Store current values before rebuilding to preserve selection if possible
    const currentPbs = pbsFilter.value;
    const currentSub = subFilter.value;

    // Get unique PBS list
    const pbsList = Object.keys(firebaseData);
    
    // Update PBS Dropdown
    pbsFilter.innerHTML = '<option value="ALL">All PBS</option>' + 
        pbsList.map(v => `<option value="${v}" ${v === currentPbs ? 'selected' : ''}>${v}</option>`).join('');

    // Determine which Substation list to show
    let subList = [];
    if (currentPbs === "ALL") {
        // Show all substations from all PBS
        for (let pbs in firebaseData) {
            subList.push(...Object.keys(firebaseData[pbs]));
        }
    } else {
        // Show only substations for the selected PBS
        subList = Object.keys(firebaseData[currentPbs] || {});
    }
    subList = [...new Set(subList)]; // Remove duplicates

    // Update Substation Dropdown
    subFilter.innerHTML = '<option value="ALL">All Substation</option>' + 
        subList.map(v => `<option value="${v}" ${v === currentSub ? 'selected' : ''}>${v}</option>`).join('');
}

function getSheetRow(pbs, sub, dev, relay) { return sheetTripData.find(r => r.pbs === pbs && r.sub === sub && r.dev === dev && r.relay === relay) || null; }
function getFaultRow(pbs, sub, dev, relay) { return faultData.find(r => r.PBS_ID === pbs && r.SUB_ID === sub && r.DEVICE_ID === dev && r.FeederID === relay) || null; }

/* =========================================================
   RENDER UPDATED: Power/Status at Substation, Trips at Feeder
   ========================================================= */
// Ensure this variable is declared at the top of your script (outside any function)
let statusCache = {}; 

function renderCards() {
  const container = document.getElementById("container");
  container.innerHTML = "";
  const pbsFilter = document.getElementById("pbsFilter").value;
  const subFilter = document.getElementById("subFilter").value;
  const now = Date.now();
  const TIMEOUT_MS = 60000;
  
  const faults = window.allFaults || [];

// ... existing renderCards setup ...

  for (let pbs in firebaseData) {
    if (pbsFilter !== "ALL" && pbs !== pbsFilter) continue;

    // --- ADD THIS TOTALIZER LOGIC ---
    let pbsOnCount = 0;
    let pbsTotalCount = 0;
    for (let sub in firebaseData[pbs]) {
      for (let dev in firebaseData[pbs][sub]) {
        for (let relay in firebaseData[pbs][sub][dev]) {
          if (["power", "deviceStatus", "lastHeartbeat"].includes(relay)) continue;
          pbsTotalCount++;
          if (firebaseData[pbs][sub][dev][relay].status === "ON") pbsOnCount++;
        }
      }
    }
    
    // Create the Summary Header for the PBS
    const pbsHeader = document.createElement("div");
    pbsHeader.innerHTML = `
      <div style="background:#e3f2fd; padding:12px; margin-top:20px; border-radius:12px; border-left:5px solid #2d9cff;">
        <h2 style="margin:0; font-size:18px;">${pbs} Summary</h2>
        <div style="margin-top:5px; font-size:15px;">
          Total Feeders ON: <b>${pbsOnCount} / ${pbsTotalCount}</b>
        </div>
      </div>
    `;
    container.appendChild(pbsHeader);
    // --------------------------------

    for (let sub in firebaseData[pbs]) {
      if (subFilter !== "ALL" && sub !== subFilter) continue;
      
      // ... continue with your existing substation loop ...

      // 1. CALCULATE AGGREGATED DATA
      let subV = 0, subI = 0, subP = 0, subPF = 0, subF = 0, count = 0;
      let isSubOnline = false;
      let subOnCount = 0;   // New Counter
      let subTotalCount = 0; // New Counter

      for (let dev in firebaseData[pbs][sub]) {
        const device = firebaseData[pbs][sub][dev];
        const lastHeartbeat = (device.lastHeartbeat || 0) * 1000;
        if ((now - lastHeartbeat) < TIMEOUT_MS) isSubOnline = true;

        // New: Loop through relays to count them
        for (let relay in device) {
           if (["power", "deviceStatus", "lastHeartbeat"].includes(relay)) continue;
           subTotalCount++;
           if (device[relay].status === "ON") subOnCount++;
        }

        const pwr = device.power || {};
        if (pwr && Object.keys(pwr).length > 0) {
          subV += Number(pwr.V || pwr.v || 0);
          subI += Number(pwr.I || pwr.c || 0);
          subP += Number(pwr.P || pwr.p || 0);
          subPF += Number(pwr.PF || pwr.pf || 0);
          subF += Number(pwr.F || pwr.f || 0);
          count++;
        }
      }

 // 2. RENDER SUBSTATION HEADER
      const title = document.createElement("div");
      title.className = "substationTitle";
      title.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>${sub}</span>
          <span style="font-size:12px; font-weight:bold; color:#2d9cff;">${subOnCount}/${subTotalCount} Feeders ON</span>
          <span style="font-size:13px; color:${isSubOnline ? '#2ecc71' : '#c62828'}">
            ● ${isSubOnline ? "ONLINE" : "OFFLINE"}
          </span>
        </div>
        
        <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:5px; margin-top:8px; background:#fff; padding:8px; border-radius:8px; border:1px solid #e0e0e0; font-size:11px; text-align:center;">
          <div><b style="color:#555;">V:</b> ${(count ? subV/count : 0).toFixed(0)}KV</div>
          <div><b style="color:#555;">I:</b> ${subI.toFixed(1)}A</div>
          <div><b style="color:#555;">P:</b> ${subP.toFixed(1)}MW</div>
          <div><b style="color:#555;">PF:</b> ${(count ? subPF/count : 0).toFixed(2)}</div>
          <div><b style="color:#555;">F:</b> ${(count ? subF/count : 0).toFixed(1)}Hz</div>
        </div>
      `;
      container.appendChild(title);

      // 3. RENDER FEEDER CARDS
      const grid = document.createElement("div");
      grid.className = "grid";
      container.appendChild(grid);

for (let dev in firebaseData[pbs][sub]) {
  for (let relay in firebaseData[pbs][sub][dev]) {
    // 1. Blacklist system keys
    if (["power", "deviceStatus", "lastHeartbeat"].includes(relay)) continue;
    
    const fb = firebaseData[pbs][sub][dev][relay];
    
    // 2. IMPORTANT: If your Sheet still uses 'relay1' but Firebase uses 'F1',
    // you must map it here. Otherwise, ensure your Sheet rows match the Firebase keys exactly.
    const row = getSheetRow(pbs, sub, dev, relay); 
    
    const id = `${pbs}_${sub}_${dev}_${relay}`;
    cardMap[id] = { pbs, sub, dev, relay };

    // --- AUTO-CLEAR LOGIC ---
    if (fb.status === "ON") {
      const clearUrl = `${SCRIPT_URL}?pbs=${encodeURIComponent(pbs)}&sub=${encodeURIComponent(sub)}&dev=${encodeURIComponent(dev)}&relay=${encodeURIComponent(relay)}&status=ON`;
      fetch(clearUrl, { method: "POST", mode: "no-cors" });
    }
   
// ------------------------
// ------------------------------------------------

          let faultReason = "";
          if (fb.status === "OFF") {
            const fault = faults.find(f => 
              String(f.pbs).trim().toUpperCase() === String(pbs).trim().toUpperCase() && 
              String(f.sub).trim().toUpperCase() === String(sub).trim().toUpperCase() && 
              String(f.dev).trim().toUpperCase() === String(dev).trim().toUpperCase() && 
              String(f.relay).trim().toUpperCase() === String(relay).trim().toUpperCase()
            );
            faultReason = fault?.fault || "";
          }
          
          const isLocked = faultReason !== "";

          grid.innerHTML += `
          <div class="card" onclick="toggleDetails('${id}')">
            <div class="row">
              <div class="led ${fb.status==="ON" ? "on" : "off blink"}"></div>
              <div class="label">${relay.toUpperCase()}</div>
            </div>
            <div class="statusText">Status: ${fb.status || "--"}</div>
            <div id="details_${id}" class="details-section">
              <div class="trip">This Month: ${row?.thisMonthTrips || 0}</div>
              <div class="trip">Last Month: ${row?.lastMonthTrips || 0}</div>
              <div class="last">Last OFF: ${row?.lastTripTime || "--"}</div>
              <div class="last">Last ON: ${row?.lastOnTime || "--"}</div>
              <div class="last"><b>Area:</b> ${row?.area || "N/A"}</div>
            </div>
            <div class="faultBox" id="fault_${id}" style="display:${fb.status==="OFF" ? "block" : "none"}" onclick="event.stopPropagation()">
              ${isLocked ? `
                <div style="font-size:12px;">
                  <b>Fault Reason:</b><br>
                  <input type="text" value="${faultReason}" disabled style="background:#e8f5e9; border:none; width:90%; padding:4px; margin-top:2px; color:#2e7d32;">
                </div>
              ` : `
                <input type="text" id="input_${id}" placeholder="Enter Fault Reason">
                <button class="smallBtn" onclick="saveFault('${id}')">Save</button>
              `}
            </div>
          </div>`;
        }
      }
    }
  }
}

function onFilterChange() {
    // When PBS changes, reset Substation filter to "ALL" or rebuild it
    document.getElementById("subFilter").value = "ALL";
    buildFilters();
    renderCards();
}
async function saveFault(id) {
  const reason = document.getElementById("input_" + id).value.trim();
  if(!reason) return alert("Enter fault reason");
  const obj = cardMap[id];
  await fetch(`${SCRIPT_URL}?mode=saveFault&pbs=${encodeURIComponent(obj.pbs)}&sub=${encodeURIComponent(obj.sub)}&dev=${encodeURIComponent(obj.dev)}&relay=${encodeURIComponent(obj.relay)}&message=${encodeURIComponent(reason)}`, {method:"POST", mode:"no-cors"});
  setTimeout(loadAll, 1000);
}
// ... existing functions ...

async function sendClearSignal(pbs, sub, dev, relay) {
  const url = `${SCRIPT_URL}?pbs=${encodeURIComponent(pbs)}&sub=${encodeURIComponent(sub)}&dev=${encodeURIComponent(dev)}&relay=${encodeURIComponent(relay)}&status=ON`;
  try {
    await fetch(url, { method: "POST", mode: "no-cors" });
    console.log("Status ON detected: Clearing buffer for " + relay);
  } catch (err) {
    console.error("Clear signal failed", err);
  }
}

async function refreshDashboard() { await loadAll(); }
refreshDashboard();
setInterval(refreshDashboard, 30000);
</script>
<div class="footer"><b>Developed by: Shanta Saha</b><br>AGM (O&amp;M)</div>
</body>
</html>
